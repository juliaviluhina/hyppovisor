# macOS packaging config (feature 010). One `npm run dist` on a macOS host
# produces arm64 + x64 .dmg + .zip in release/. Signing (mac.identity /
# mac.notarize) is a deferred follow-up — this release is unsigned.

appId: com.juliaviluhina.hyppovisor
productName: HyppoVisor

directories:
  output: release # git-ignored; avoids colliding with dist/ (tsc output)
  buildResources: build # electron-builder reads build/icon.png → generates .icns

files:
  - dist/**
  - package.json
  - "!**/*.map"

extraResources:
  - LICENSE
  - NOTICE
  - THIRD-PARTY-LICENSES

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Pin the already-installed runtime so packaging needs no network (FR-004).
electronDist: node_modules/electron/dist

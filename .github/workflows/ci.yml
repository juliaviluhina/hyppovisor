name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run on demand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ~170 MB Electron runtime — cache it across runs, keyed on the pinned version.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      # Electron + Playwright _electron need Chromium's shared libs on Linux.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: npx playwright install-deps

      - run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E (Linux — headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Single stable check name to require in branch protection — stays valid even
  # if the matrix above changes. Fails unless every matrix leg succeeded.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          echo "test result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]

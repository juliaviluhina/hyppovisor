<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HyppoVisor</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        height: 104px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid rgba(128, 128, 128, 0.4);
      }
      #bar {
        display: flex;
        gap: 6px;
        padding: 8px;
        align-items: center;
      }
      #address {
        flex: 1;
        padding: 5px 8px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        padding: 0 8px 8px;
        overflow-x: auto;
      }
      .tab {
        padding: 3px 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 6px;
        white-space: nowrap;
        cursor: pointer;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tab.active {
        background: rgba(128, 128, 128, 0.2);
        font-weight: 600;
      }
      .tab .x {
        opacity: 0.6;
      }
      #activity {
        margin-left: auto;
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      #mcp {
        padding: 0 8px 6px;
        font-size: 11px;
        opacity: 0.6;
        user-select: text;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="go">Open</button>
      <input id="address" placeholder="https://…" />
      <span id="activity"></span>
    </div>
    <div id="tabs"></div>
    <div id="mcp">MCP: starting…</div>
    <script type="module" src="./app.js"></script>
  </body>
</html>

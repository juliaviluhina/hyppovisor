<!doctype html>
<html>
  <head>
    <title>Form Fixture Page</title>
  </head>
  <body>
    <h1>Form fixture</h1>

    <form id="theform" action="/submitted" method="post">
      <!-- feature 005: <label for> elements so the reader has a verbatim accessible
           name for each field. Labels carry no external-act wording. -->
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" />

      <!-- feature 003: plain value fields inside the form (fill permitted) -->
      <label for="first_name">First name</label>
      <input type="text" id="first_name" name="first_name" />
      <label for="last_name">Last name</label>
      <input type="text" id="last_name" name="last_name" />
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" />
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" />
      <label for="website">Website</label>
      <input type="url" id="website" name="website" />
      <label for="age">Age</label>
      <input type="number" id="age" name="age" />
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio"></textarea>
      <label for="cover">Cover letter</label>
      <div id="cover" contenteditable="true"></div>

      <!-- feature 005: a hidden control — listed with visible:false (spec Edge
           Case: Greenhouse's real file input is hidden). -->
      <input type="text" id="hiddenField" name="hiddenField" hidden />

      <!-- feature 005: a control with neither id nor name — exercises structural
           selector synthesis (selectorSynthesised: true). -->
      <label>Middle name <input type="text" /></label>

      <!-- feature 005: a radio group in a <fieldset> — each radio is its own
           record sharing a `group` id (the shared name "shift"). -->
      <fieldset id="shift">
        <legend>Preferred shift</legend>
        <label><input type="radio" name="shift" value="day" /> Day</label>
        <label><input type="radio" name="shift" value="night" /> Night</label>
      </fieldset>

      <!-- a React-style controlled input: an instance-level value setter that
           keeps a tracker, exactly like React's. A plain `el.value = x` is
           swallowed (tracker stays in sync, onChange suppressed); only the
           native prototype setter drives it. -->
      <label for="reactish">Preferred name</label>
      <input type="text" id="reactish" name="reactish" />

      <!-- feature 003: fill targets that stay refused -->
      <label for="resume">Resume</label>
      <input type="file" id="resume" name="resume" />
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select…</option>
        <option value="de">Germany</option>
        <option value="us">United States</option>
      </select>

      <!-- react-select-style combobox: container is a <div role=combobox>,
           the typed-text input carries role=combobox and accepts a filter string -->
      <div id="locationCombobox" role="combobox" aria-expanded="true">
        <input type="text" id="locationInput" role="combobox" aria-autocomplete="list" />
        <ul role="listbox" id="locationListbox">
          <li role="option" tabindex="-1" id="locationOptionBerlin">Berlin, Germany</li>
          <li role="option" tabindex="-1" id="locationOptionMunich">Munich, Germany</li>
        </ul>
      </div>

      <!-- consent checkbox INSIDE the form; label is a wrapping <label> -->
      <label
        ><input type="checkbox" id="agree" name="agree" /> I agree to the terms and
        conditions</label
      >

      <!-- a plain, non-submit button inside the form: click is refused by in-form,
           space is permitted (feature 003 US3) -->
      <button type="button" id="addAnother">Add another</button>

      <button type="submit" id="submitBtn">Apply now</button>
    </form>

    <!-- feature 005: a second form — read_form_fields container scoping (US4). -->
    <form id="otherform" action="/other" method="post">
      <label for="other_field">Other field</label>
      <input type="text" id="other_field" name="other_field" required />
    </form>

    <!-- feature 005: two controls sharing an id (invalid HTML) — each record
         gets a disambiguated structural selector and duplicateId: true. -->
    <label>Dup one <input type="text" id="dupfield" /></label>
    <label>Dup two <input type="text" id="dupfield" /></label>

    <!-- a safe control outside any form -->
    <button type="button" id="safeBtn" onclick="document.getElementById('revealed').hidden = false">
      Show more
    </button>
    <div id="revealed" hidden>revealed extra content</div>

    <!-- a link labelled with external-act wording -->
    <a href="/connect" id="connectLink">Connect</a>

    <!-- a Save button outside any form -->
    <button type="button" id="saveBtn">Save changes</button>

    <!-- a consent checkbox with its label outside any form -->
    <input type="checkbox" id="tos" />
    <label for="tos">I accept the Terms of Service</label>

    <!-- a plain filter checkbox, should stay allowed -->
    <input type="checkbox" id="remoteOnly" />
    <label for="remoteOnly">Show only remote roles</label>

    <!-- feature 006: dropdown choosers for the choose_option operation -->
    <div id="dropdowns">
      <!-- (e) a <select> whose accessible name reads as consent / outward action -->
      <label for="marketingSelect">I agree to receive marketing email</label>
      <select id="marketingSelect" name="marketing">
        <option value="">Choose…</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>

      <!-- (f) two options sharing the visible label "Other", distinct values -->
      <label for="otherSelect">Other choices</label>
      <select id="otherSelect" name="other_choice">
        <option value="">Choose…</option>
        <option value="other-a">Other</option>
        <option value="other-b">Other</option>
      </select>

      <!-- (g) a disabled option -->
      <label for="pronounSelect">Pronoun</label>
      <select id="pronounSelect" name="pronoun">
        <option value="">Choose…</option>
        <option value="they">They / them</option>
        <option value="no-say" disabled>Prefer not to say</option>
      </select>

      <!-- (h) a multi-select -->
      <label for="skillsSelect">Skills</label>
      <select id="skillsSelect" name="skills" multiple>
        <option value="js">JavaScript</option>
        <option value="ts">TypeScript</option>
      </select>

      <!-- (a) a closed react-select-style combobox: options inserted into its
           listbox only when it is opened by click -->
      <div id="closedCombo" role="combobox" aria-expanded="false" aria-controls="closedComboListbox" tabindex="0">
        <span id="closedComboValue"></span>
      </div>
      <ul role="listbox" id="closedComboListbox"></ul>

      <!-- (b) a combobox with a filter input narrowing a >=4 option list -->
      <div id="filterCombo" role="combobox" aria-expanded="true">
        <input type="text" id="filterComboInput" role="combobox" aria-autocomplete="list" />
        <ul role="listbox" id="filterComboListbox">
          <li role="option" data-value="fr">France</li>
          <li role="option" data-value="fi">Finland</li>
          <li role="option" data-value="de">Germany</li>
          <li role="option" data-value="gr">Greece</li>
        </ul>
      </div>

      <!-- (c) a combobox whose options only ever append after a long delay -->
      <div id="asyncCombo" role="combobox" aria-expanded="false" aria-controls="asyncComboListbox" tabindex="0">
        <span id="asyncComboValue"></span>
      </div>
      <ul role="listbox" id="asyncComboListbox"></ul>

      <!-- (d) read-back sabotage: renders an option but its click handler is a no-op -->
      <div id="sabotageCombo" role="combobox" aria-expanded="false" aria-controls="sabotageComboListbox" tabindex="0">
        <span id="sabotageComboValue"></span>
      </div>
      <ul role="listbox" id="sabotageComboListbox"></ul>

      <!-- (i) a combobox exposing its listbox via aria-owns (sibling, not descendant) -->
      <div id="ownedCombo" aria-owns="ownedListbox" tabindex="0">
        <span id="ownedComboValue"></span>
      </div>
      <ul role="listbox" id="ownedListbox">
        <li role="option" data-value="rome">Rome, Italy</li>
        <li role="option" data-value="oslo">Oslo, Norway</li>
      </ul>

      <!-- (j) a "creatable" combobox: its filter input does not filter; the typed
           label is simply not among the fixed options -->
      <div id="creatableCombo" role="combobox" aria-expanded="true">
        <input type="text" id="creatableComboInput" role="combobox" aria-autocomplete="list" />
        <ul role="listbox" id="creatableComboListbox">
          <li role="option" data-value="red">Red</li>
          <li role="option" data-value="green">Green</li>
        </ul>
      </div>

      <!-- a multi-value combobox — refused multi-select -->
      <div id="multiCombo" role="combobox" aria-multiselectable="true" aria-owns="multiListbox">
        <span id="multiComboValue"></span>
      </div>
      <ul role="listbox" id="multiListbox">
        <li role="option" data-value="a">Alpha</li>
        <li role="option" data-value="b">Beta</li>
      </ul>

      <!-- a combobox that removes itself when opened — control removed mid-operation -->
      <div id="vanishCombo" role="combobox" aria-expanded="false" aria-controls="vanishListbox" tabindex="0">
        <span id="vanishComboValue"></span>
      </div>
      <ul role="listbox" id="vanishListbox"></ul>
    </div>

    <script>
      // feature 003: record any real submission so tests can assert none occurred.
      window.__submitted = false;
      document.getElementById("theform").addEventListener("submit", function (e) {
        e.preventDefault();
        window.__submitted = true;
      });
      // #reactish: mimic React's instance value setter + _valueTracker so a test
      // can prove `fill` goes through the native setter (component state updates)
      // and not a plain assignment (silently swallowed).
      (function () {
        var el = document.getElementById("reactish");
        var proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
        var tracker = "";
        Object.defineProperty(el, "value", {
          configurable: true,
          get: function () {
            return proto.get.call(el);
          },
          set: function (v) {
            tracker = String(v);
            proto.set.call(el, v);
          },
        });
        window.__reactishState = "";
        el.addEventListener("input", function () {
          var dom = proto.get.call(el);
          if (tracker !== dom) {
            tracker = dom;
            window.__reactishState = dom;
          }
        });
      })();

      // feature 004 US3: deterministic mid-write removal. When armed (a test sets
      // window.__armPhoneRemoval = true), the first #email `input` event removes
      // #phone from the DOM — so a batch ordered [..., #email, #phone, ...] passes
      // the pre-write check (every selector still resolves then) but #phone's own
      // write finds nothing. Disarmed by default so single-field fill tests that
      // touch both #email and #phone are unaffected.
      window.__armPhoneRemoval = false;
      (function () {
        var email = document.getElementById("email");
        email.addEventListener("input", function () {
          if (!window.__armPhoneRemoval) return;
          var phone = document.getElementById("phone");
          if (phone) phone.remove();
        });
      })();

      // record option activation for the combobox-commit assertions.
      window.__chosenOption = null;
      for (const opt of document.querySelectorAll('#locationListbox [role="option"]')) {
        opt.addEventListener("click", function () {
          window.__chosenOption = opt.id;
        });
      }

      // ─── feature 006: choose_option chooser behaviours ──────────────────────
      window.__chosen006 = {};

      // (a)/(c)/(d): comboboxes that populate their listbox on open. `mode`:
      //   "normal"   — options render synchronously on open
      //   "async"    — options render only after a delay well past the test budget
      //   "sabotage" — options render, but the option click handler does nothing
      function wireOpeningCombo(id, opts, mode) {
        var combo = document.getElementById(id);
        var listbox = document.getElementById(combo.getAttribute("aria-controls"));
        var valueEl = document.getElementById(id + "Value");
        function renderOptions() {
          listbox.innerHTML = "";
          opts.forEach(function (o) {
            var li = document.createElement("li");
            li.setAttribute("role", "option");
            li.setAttribute("data-value", o.value);
            li.textContent = o.label;
            li.addEventListener("click", function () {
              if (mode === "sabotage") return; // read-back sabotage: commit nothing
              window.__chosen006[id] = o.value;
              if (valueEl) valueEl.textContent = o.label;
              combo.setAttribute("aria-expanded", "false");
              listbox.innerHTML = "";
            });
            listbox.appendChild(li);
          });
        }
        combo.addEventListener("click", function () {
          if (combo.getAttribute("aria-expanded") === "true") {
            combo.setAttribute("aria-expanded", "false");
            listbox.innerHTML = "";
            return;
          }
          combo.setAttribute("aria-expanded", "true");
          if (mode === "async") setTimeout(renderOptions, 5000);
          else renderOptions();
        });
      }
      wireOpeningCombo(
        "closedCombo",
        [
          { label: "Toronto, Canada", value: "toronto" },
          { label: "Vancouver, Canada", value: "vancouver" },
        ],
        "normal",
      );
      wireOpeningCombo("asyncCombo", [{ label: "Late Option", value: "late" }], "async");
      wireOpeningCombo("sabotageCombo", [{ label: "Sabotage Option", value: "sab" }], "sabotage");

      // (b) filter combobox — typing removes options whose label does not start
      // with the query; option elements are rebuilt on each keystroke.
      (function () {
        var input = document.getElementById("filterComboInput");
        var listbox = document.getElementById("filterComboListbox");
        var all = [].slice.call(listbox.children).map(function (li) {
          return { label: li.textContent, value: li.getAttribute("data-value") };
        });
        function bindOption(li, o) {
          li.addEventListener("click", function () {
            window.__chosen006["filterCombo"] = o.value;
            input.value = o.label;
          });
        }
        [].slice.call(listbox.children).forEach(function (li, i) {
          bindOption(li, all[i]);
        });
        input.addEventListener("input", function () {
          var q = input.value.trim().toLowerCase();
          listbox.innerHTML = "";
          all.forEach(function (o) {
            if (q && o.label.toLowerCase().indexOf(q) !== 0) return;
            var li = document.createElement("li");
            li.setAttribute("role", "option");
            li.setAttribute("data-value", o.value);
            li.textContent = o.label;
            bindOption(li, o);
            listbox.appendChild(li);
          });
        });
      })();

      // (i) aria-owns owned listbox — static options
      (function () {
        var valueEl = document.getElementById("ownedComboValue");
        [].slice.call(document.getElementById("ownedListbox").children).forEach(function (li) {
          li.addEventListener("click", function () {
            window.__chosen006["ownedCombo"] = li.getAttribute("data-value");
            valueEl.textContent = li.textContent;
          });
        });
      })();

      // (j) creatable combobox — the filter input does NOT filter; the fixed
      // options never include a typed-in label, so an unknown label is no-match.
      (function () {
        var listbox = document.getElementById("creatableComboListbox");
        [].slice.call(listbox.children).forEach(function (li) {
          li.addEventListener("click", function () {
            window.__chosen006["creatableCombo"] = li.getAttribute("data-value");
          });
        });
      })();

      // a combobox that deletes itself the moment it is opened
      (function () {
        var combo = document.getElementById("vanishCombo");
        combo.addEventListener("click", function () {
          combo.remove();
        });
      })();
    </script>
  </body>
</html>

    <title>DOM Noise Repro Fixture (issue 008)</title>
    <!--
      Reproduces the shape behind specs/issues/008-read-page-dom-noise-reduction.md,
      measured against a real page (app.jackandjill.ai's kanban dashboard,
      #jack-main-panel, 2026-09-04): a selector-scoped `read_page({ includeDom: true })`
      already excludes an unrelated sibling panel (issue 007 / feature 016's job), but
      the DOM it returns is still dominated by decoration that carries no information a
      caller reading page structure needs:

        - Real page, #jack-main-panel scoped DOM: 37,233 bytes total.
          - 21.6% (8,032 bytes) was inline <svg> icon markup (12 icons, all aria-hidden="true"
            — decorative, per the platform's own accessibility semantics).
          - 42.2% (15,714 bytes) was `class="…"` utility-string content (220 attributes).
          - Crude tag-stripped visible text: ~1,669 chars — under 5% of the DOM bytes.

      This fixture reproduces the same *shape* offline, small enough to keep in the repo,
      anonymized (no real company/candidate data, no tracking tokens): a short list of
      "cards", each wrapped in a long Tailwind-style utility class string and an inline
      multi-path SVG icon, around one short line of text that is the only thing a caller
      actually wants. A <script>, a <style> block, and an HTML comment are also included
      so a future noise-reduction pass has script/style/comment stripping to exercise too.

      What issue 008 proposes: once implemented, a noise-reduction pass on
      `read_page({ selector: "#job-list", includeDom: true, reduceNoise: true })`
      (parameter name/default TBD during specification) should return DOM markup with the
      <script>/<style>/comment nodes, decorative (aria-hidden) icon <svg> elements, and the
      presentation-only class/style attributes stripped, while every card's visible text
      (title + company) survives intact — same spirit as issue 007's fixture: an offline,
      byte-measurable acceptance check once the feature exists. Card one's icon carries
      aria-hidden="true" (decorative, dropped by reduction); its badge icon instead carries
      role="img" + aria-label (meaningful, preserved by reduction) — proving reduction
      distinguishes the two rather than stripping every <svg> unconditionally.
    -->
    <style>
      /* Presentation-only — a noise-reduction pass should be able to drop this node
         entirely; it contributes no information to a caller reading page structure. */
      .card { border: 1px solid #eee; }
    </style>
  </head>
